<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MLog Configurator</title>
<style>
:root{--bg:#14161a;--panel:#1c2027;--panel2:#232833;--line:#2e3440;--text:#d5dbe8;--muted:#828b9e;--accent:#ff9f43;--ok:#4cd97b;--warn:#e5b567}
*{box-sizing:border-box}
/* Scrollbars in the panel, the preview and the open combo list: dark and thin, so they
   read as part of the chrome instead of a bright OS strip. The standard properties cover
   Firefox; the ::-webkit- rules cover Chromium/Edge. The transparent border plus
   background-clip insets the thumb, giving it breathing room inside the track. */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border:2px solid transparent;border-radius:6px;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);border:2px solid transparent;border-radius:6px;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:15px;margin:0;font-weight:600}
select{margin-left:auto;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
main{flex:1;display:flex;min-height:0}
#params{width:370px;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:14px 16px 24px}
.panebar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted)}
#params .panebar{border-bottom:1px solid var(--line);margin:-14px -16px 14px;padding-left:16px;padding-right:16px}
#outwrap{flex:1;display:flex;flex-direction:column;min-width:0;background:#101216}
#outwrap .panebar{background:var(--panel2);border-bottom:1px solid var(--line)}
pre#out{flex:1;margin:0;padding:14px 16px;overflow:auto;font:13px/1.5 ui-monospace,Consolas,monospace;color:#b9c3d8;white-space:pre}
/* Preview is one block per line so a single changed line can be flashed. min-height
   keeps blank lines from collapsing to zero; max-content width keeps long lines
   scrollable and lets a short line's highlight span the full row. */
#out .ln{min-height:1.5em;width:max-content;min-width:100%;border-radius:2px}
/* An ordinary edit: a transient flash that fades back to nothing. */
#out .ln.hit{animation:lineflash .7s ease-out}
@keyframes lineflash{from{background:rgba(255,159,67,.32)}to{background:transparent}}
/* An import gets its own animation, separate from the flash above. It lights up and settles
   on the held colour, and `forwards` keeps it there while the paste awaits Confirm or
   Decline. A line carries `held` or `hit`, never both, and there is no transition anywhere,
   so exactly one thing writes `background` and nothing can fight the animation. */
#out .ln.held{animation:importflash .7s ease-out forwards}
@keyframes importflash{0%{background:rgba(255,159,67,.45)}100%{background:rgba(255,159,67,.22)}}
@media (prefers-reduced-motion:reduce){
  #out .ln.hit{animation:none}
  /* Keep the steady highlight without the entry animation, so an import is still marked. */
  #out .ln.held{animation:none;background:rgba(255,159,67,.22)}
}
button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
button.copied{border-color:var(--ok);color:var(--ok)}
.field{margin-bottom:16px}
.lab{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin-bottom:2px}
.badge{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;letter-spacing:.5px}
.desc{font-size:11.5px;color:var(--muted);margin:0 0 6px}
input[type=text],input[type=number],#form select{width:100%;background:#12151a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font:13px ui-monospace,Consolas,monospace}
input:focus,#form select:focus{outline:none;border-color:var(--accent)}
.arrrow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.arrrow .idx{width:22px;text-align:right;color:var(--muted);font:11px ui-monospace,monospace;flex:none}
.arrrow input,.arrrow select{flex:1}
.arrrow .combo{flex:1;min-width:0}
/* string field: a checkbox that decides whether the value is set at all, plus the content.
   Unchecked disables the text area — there is nothing to type into an absent value. */
.strwrap{display:flex;align-items:flex-start;gap:7px;width:100%}
.strwrap .strbox{flex:none;margin:7px 0 0}
.strwrap .strin{flex:1;min-width:0;resize:vertical;overflow:hidden;background:#12151a;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:6px 8px;font:13px ui-monospace,Consolas,monospace;line-height:1.5}
.strwrap .strin:focus{outline:none;border-color:var(--accent)}
.strwrap .strin:disabled{opacity:.45;cursor:not-allowed}
.arrrow .strwrap{flex:1;min-width:0}
/* enum field: typeable input + one shared floating list. Matches float to the top on
   typing and everything else stays listed below, so no option is ever hidden. */
.combo{position:relative;display:flex;align-items:center;width:100%}
.combo .comboin{flex:1;min-width:0;padding-right:22px}
.combo .car{position:absolute;right:8px;color:var(--muted);pointer-events:none;font-size:10px}
.combo.warn .comboin{border-color:var(--warn);color:var(--warn)}
.combolist{position:fixed;z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.5);max-height:230px;overflow-y:auto;font:12.5px/1.5 ui-monospace,Consolas,monospace;color:var(--text)}
.combolist .opt{padding:3px 9px;cursor:pointer;white-space:nowrap}
.combolist .opt.act{background:var(--accent);color:#14161a}
.combolist .opt.cur{font-weight:600}
.combolist .opt.unk{color:var(--warn)}
.combolist .sep{height:1px;background:var(--line);margin:3px 0}
.x{flex:none;width:24px;padding:3px 0;font-size:12px;line-height:1}
.arrfoot{display:flex;align-items:center;gap:10px;margin-top:8px}
.count{font-size:11.5px;color:var(--muted)}
.gapwarn{color:var(--warn);font-size:11.5px;display:none;margin-top:6px}
/* ── import: paste settings back in ────────────────────────────────────────── */
.acts{display:flex;gap:6px}
#pasterow{display:none;margin:-2px 0 12px}
#pasterow.on{display:block}
#pasterow input{width:100%;background:#12151a;border:1px solid var(--accent);border-radius:6px;padding:6px 8px;font:12px ui-monospace,Consolas,monospace;color:var(--text)}
#pasterow input:focus{outline:none}
#pasterow .hint{font-size:11px;color:var(--muted);margin-top:5px}
#pending{display:none;border:1px solid var(--accent);border-radius:6px;background:var(--panel2);padding:9px 11px;margin-bottom:14px}
#pending.on{display:block}
#pending .msg{font-size:12.5px;margin-bottom:8px}
#pending .msg b{color:var(--accent)}
#pending .msg .miss{color:var(--muted)}
#pending .acts{justify-content:flex-end}
#note{display:none;font-size:11.5px;color:var(--muted);margin:-6px 0 12px}
#note.on{display:block}
/* While a paste is pending the form shows the incoming values but cannot be edited until
   the paste is confirmed or declined. Reset and the script picker stay usable: they rebuild
   from defaults, which discards the pending paste. */
#form.locked{opacity:.55}
</style>
</head>
<body>
<header>
  <h1>MLog Configurator</h1>
  <select id="script"></select>
</header>
<main>
  <section id="params">
    <div class="panebar">
      <span>Parameters</span>
      <span class="acts">
        <button id="paste" title="fill the form from a pasted script">Paste settings</button>
        <button id="reset" title="restore defaults">Reset</button>
      </span>
    </div>
    <div id="pasterow">
      <input id="pastebox" type="text" autocomplete="off" spellcheck="false" placeholder="click here, then Ctrl+V">
      <div class="hint">Values are read from the <code>set</code> lines; everything else in the text is ignored. <b>Esc</b> closes.</div>
    </div>
    <div id="pending">
      <div class="msg" id="pmsg"></div>
      <div class="acts"><button id="pdecline">Decline</button><button id="pconfirm">Confirm</button></div>
    </div>
    <div id="note"></div>
    <div id="form"></div>
  </section>
  <section id="outwrap">
    <div class="panebar"><span>Generated script</span><button id="copy">Copy to clipboard</button></div>
    <pre id="out"></pre>
  </section>
</main>

<script>
const TEMPLATES = {
  "coretocontainer": {
    "id": "coretocontainer",
    "title": "CoreToContainer",
    "params": [
      {
        "name": "item",
        "var": "item",
        "indent": "    ",
        "max": 16,
        "size": "variable",
        "default": [
          "@coal"
        ],
        "type": "item",
        "description": "Items to deliver"
      },
      {
        "name": "target_amount",
        "default": "200",
        "type": "int",
        "description": "target amount of each item"
      },
      {
        "name": "the_unit_type",
        "default": "@poly",
        "type": "unit",
        "description": "carrier unit"
      },
      {
        "name": "core_x",
        "default": "125",
        "type": "int",
        "description": "Core location X"
      },
      {
        "name": "core_y",
        "default": "240",
        "type": "int",
        "description": "Core location Y"
      },
      {
        "name": "park_x",
        "default": "111",
        "type": "int",
        "description": "Parking spot X"
      },
      {
        "name": "park_y",
        "default": "220",
        "type": "int",
        "description": "Parking spot Y"
      },
      {
        "name": "move_timeout",
        "default": "45",
        "type": "int",
        "description": "seconds before a move is declared stuck"
      },
      {
        "name": "pick_stall_max",
        "default": "5",
        "type": "int",
        "description": "pickup: no-progress polls (~0.2 s each) => source empty"
      },
      {
        "name": "drop_stall_max",
        "default": "10",
        "type": "int",
        "description": "drop: no-progress polls => container full/unreachable"
      },
      {
        "name": "the_container",
        "default": "container1",
        "type": "block",
        "description": "Destination storage"
      }
    ],
    "lines": [
      "# ============================================================================\n#  core_to_container.mlog\n# ----------------------------------------------------------------------------\n#  Batch resource delivery: CORE -> CONTAINER via one bound courier unit.\n#\n#  behaviour\n#    - binds ONE unit of the configured type; units controlled by a player,\n#      a command or another processor are NEVER taken (checked on bind and\n#      continuously while working)\n#    - delivers a LIST of items (item0..item15 in CONFIG, zero-terminated:\n#      first null slot ends the list; length auto-detected at init). All\n#      slots share target_amount as their container level threshold.\n#    - every trip loads a MAX batch (full cargo capacity) of ONE item and\n#      drops it all; partial-batch trips never happen (an item is only\n#      selected when the core holds a full batch of it)\n#    - at IDLE, the first slot whose container level < target becomes the\n#      remembered trip item; at the core the remembered item is checked\n#      first, else both sides are re-walked (first missing slot with a full\n#      core batch wins). Nothing shippable but some slot short -> wait at\n#      the core and retry each pass. No missing slots at all -> complete.\n#    - when done: unit moves to the parking spot, control is released\n#      (ucontrol unbind); the script keeps monitoring and re-dispatches if\n#      any level falls below target again -- preferring to re-bind the very\n#      same unit it used before (matched by unit reference)\n#    - stolen-unit detection: if a player/command/other processor takes our\n#      unit mid-job, the event is logged to message2 and the claim released\n#\n#  blocks (names are unique per team -> each instance needs its own set;\n#  edit CONFIG below for extra instances)\n#    container1   delivery destination (container or vault, any size)\n#    message1     step/state readout   (state change + refresh every 5 s)\n#    message2     event/debug log      (bind / steal / stall / errors)\n#    illuminator1 status light, OPTIONAL:\n#                 green = idle/target met | blue = delivering\n#                 yellow = waiting for source at core | red = error\n#\n#  notes\n#    - target_amount is a shared container LEVEL threshold, not a one-shot\n#      count: if any slot drains below it again, delivery resumes.\n#    - keep target_amount <= container capacity of each item; otherwise the\n#      drop phase stalls (detected + logged) and the unit parks with cargo.\n#    - core_x/core_y must point at the CORE block itself (any variant). The\n#      block reference is resolved at runtime via ucontrol getBlock from the\n#      bound unit -- ulocate is unreliable (field notes), so it is not used.\n#      No core found on arrival -> TERMINAL CORE_NOT_FOUND state (red light +\n#      message1, unit released) - fix coordinates and reload the script.\n#    - works on any processor; a logic processor gives comfortable headroom.\n# ============================================================================\n\n# ----------------------------------------------------------------------------\n#  CONFIG -- edit per instance (executed once, first pass only)\n# ----------------------------------------------------------------------------\nstart:\n    jump main_loop equal initialized true\n    set initialized true\n\n    # --- delivery parameters ------------------------------------\n    # Item list, zero-terminated: the first null slot ends the list; its\n    # length is auto-detected at init (no count variable). All slots share\n    # target_amount. Unused trailing slots stay null.",
      "    # Items to deliver",
      {
        "a": "item"
      },
      "\n    # container level threshold, shared by all items",
      [
        "    set target_amount ",
        {
          "p": "target_amount"
        },
        " # target amount of each item"
      ],
      [
        "    set the_unit_type ",
        {
          "p": "the_unit_type"
        },
        " # carrier unit"
      ],
      [
        "    set core_x ",
        {
          "p": "core_x"
        },
        " # Core location X"
      ],
      [
        "    set core_y ",
        {
          "p": "core_y"
        },
        " # Core location Y"
      ],
      [
        "    set park_x ",
        {
          "p": "park_x"
        },
        " # Parking spot X"
      ],
      [
        "    set park_y ",
        {
          "p": "park_y"
        },
        " # Parking spot Y"
      ],
      "\n\n    # --- per-instance blocks ------------------------------------------\n    # the_container is REQUIRED: resolved from container1 in init; null drives st_cfgerr.\n    # message1 / message2 / illuminator1 are OPTIONAL and used directly by\n    # name at every use site - a block linked later is picked up\n    # automatically (each instruction re-resolves the name), and writing\n    # into an unlinked (null) ref is a no-op. Never cached, never checked.\n\n    # --- tuning -----------------------------------------------------",
      [
        "    set move_timeout ",
        {
          "p": "move_timeout"
        },
        " # seconds before a move is declared stuck"
      ],
      [
        "    set pick_stall_max ",
        {
          "p": "pick_stall_max"
        },
        " # pickup: no-progress polls (~0.2 s each) => source empty"
      ],
      [
        "    set drop_stall_max ",
        {
          "p": "drop_stall_max"
        },
        " # drop: no-progress polls => container full/unreachable"
      ],
      "\n# ----------------------------------------------------------------------------\n#  INIT -- full setup; also the retry entry point of st_cfgerr\n# ----------------------------------------------------------------------------\ninit:\n    # --- resolve required block ref (null until linked) -----------------",
      [
        "    set the_container ",
        {
          "p": "the_container"
        },
        " # Destination storage"
      ],
      "\n    # --- state constants (FSM values; defined before first use)------\n    set st_idle 10 # idle / target met\n    set st_tocore 20 # traveling to core\n    set st_pickup 30 # loading max batch at core\n    set st_waitsrc 40 # waiting for source at core\n    set st_tocont 50 # traveling to container\n    set st_drop 60 # unloading at container\n    set st_park 70 # parking + release\n    set st_cfgerr 90 # invalid config: report, wait, re-run init\n    set st_coreerr 95 # core not found at configured coords (terminal)\n    set state st_idle # current FSM state\n    set the_unit null # bound unit reference (null = none)\n    set saved_unit_ref null # our last unit ref (reuse preference)\n    set saved_ok false # true => saved_unit_ref valid, try to re-bind it\n    set trips_done 0 # completed drop legs\n    set cycle 0 # pass counter (debug)\n    set vb_counter 10 # validate_bind throttle countdown\n    set err_until 0 # @second until which the light flashes red\n    set last_step_t 0 # last step-line flush time\n    set last_state st_idle # matches initial state -> no duplicate line\n    set state_name \"BOOT\" # label shown in message1\n    set last_nf_t 0 # throttle: no-free-unit notice\n    set trip_item null # item selected for the current trip (null = none yet)\n    set trip_slot null # slot index of trip_item\n\n    # --- item list length detection (zero-terminated scan) --------------\n    set idx 0\n    set item_count 0\nscan_next:\n    jump scan_done greaterThanEq idx 16 # hard cap: the list has at most 16 slots\n    set ret @counter\n    jump get_item always\n    op equal slot_null result null # resume; is this slot unused?\n    jump scan_done equal slot_null true\n    op add item_count item_count 1\n    op add idx idx 1\n    jump scan_next always\nscan_done:\n    jump init_items_ok greaterThan item_count 0\n    print \"WARNING: no delivery slots configured (item0..item15 all null)\"\n    printflush message2\ninit_items_ok:\n\n    # --- status light palette (light optional; null writes are no-ops) --\n    packcolor col_idle 0.25 0.85 0.35 1 # green : idle / target met\n    packcolor col_work 0.25 0.55 1.00 1 # blue : delivering\n    packcolor col_wait 1.00 0.80 0.10 1 # yellow: waiting for source\n    packcolor col_error 1.00 0.15 0.15 1 # red : error flash\n    set cur_col col_idle\n\n    # --- config sanity (only the required block is checked) --------------\n    jump init_cfg_ok notEqual the_container null\n    set state st_cfgerr\n    jump main_loop always\ninit_cfg_ok:\n    # --- clear message blocks on boot -----------------------------------\n    print \"\"\n    printflush message1\n    print \"\"\n    printflush message2\n\n    print \"boot: \"\n    print item_count\n    print \" delivery slot(s), first=\"\n    print item0\n    print \" from core(\"\n    print core_x\n    print \",\"\n    print core_y\n    print \") to \"\n    print the_container\n    print \" target=\"\n    print target_amount\n    printflush message1\n    set last_step_t @second\n    jump main_loop always\n\n# ----------------------------------------------------------------------------\n#  MAIN LOOP -- one pass per processor cycle batch\n# ----------------------------------------------------------------------------\nmain_loop:\n    op add cycle cycle 1\n\n    # --- FSM dispatch -----------------------------------------------------------------\n    jump s_idle equal state st_idle\n    jump s_tocore equal state st_tocore\n    jump s_pickup equal state st_pickup\n    jump s_waitsrc equal state st_waitsrc\n    jump s_tocont equal state st_tocont\n    jump s_drop equal state st_drop\n    jump s_park equal state st_park\n    jump s_cfgerr equal state st_cfgerr\n    jump s_coreerr equal state st_coreerr\n    set state st_idle # unknown state -> safe reset\n    jump s_idle always\n\n# ----------------------------------------------------------------------------\n#  STATE: IDLE -- select the trip item (Walk A), then ensure a unit is bound\n# ----------------------------------------------------------------------------\ns_idle:\n    jump idle_color_done equal cur_col col_wait # still waiting for a free unit -> stay yellow\n    set cur_col col_idle\nidle_color_done:\n    set state_name \"IDLE\"\n    # --- reset trip memory on IDLE entry (nothing stale across trips) --\n    set trip_item null\n    set trip_slot null\n    set ret @counter\n    jump do_status always\n    # --- (returned) status applied; decide whether work is needed ----\n    # --- Walk A: first slot below target becomes the remembered item ----\n    jump s_idle_end equal item_count 0 # degenerate config; warned at boot, stay quiet\n    set idx 0\nidle_wa_loop:\n    jump deliver_complete greaterThanEq idx item_count # no missing slots -> complete\n    set ret @counter\n    jump get_item always\n    op equal slot_null result null # resume; defensive (walk is count-bounded)\n    jump idle_wa_next equal slot_null true\n    sensor have_now the_container result\n    jump idle_wa_next greaterThanEq have_now target_amount # satisfied -> skip\n    set trip_item result # first missing slot -> remembered for this trip\n    set trip_slot idx\n    jump idle_work always\nidle_wa_next:\n    op add idx idx 1\n    jump idle_wa_loop always\nidle_work:\n    # --- work needed: ensure a unit is bound ----------------------------\n    jump idle_bound notEqual the_unit null\n    set ret @counter\n    jump bind_scan always\n    # --- (returned) scan failed => no free unit right now, retry next pass\n    jump idle_nofree equal the_unit null\n    set state st_tocore # bound -> dispatch\n    jump s_idle_end always\nidle_nofree:\n    set cur_col col_wait # unexpected delay: waiting for a free unit -> yellow\n    op add nf_due last_nf_t 10\n    jump s_idle_end lessThan @second nf_due\n    set last_nf_t @second\n    print \"no free \"\n    print the_unit_type\n    print \" unit available\"\n    printflush message2\n    jump s_idle_end always\nidle_bound:\n    # already bound (e.g. returning from a stuck move) -> resume work\n    set vb_ret @counter\n    jump validate_bind always\n    set state st_tocore\ns_idle_end:\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  STATE: TO_CORE -- travel to the configured core position\n# ----------------------------------------------------------------------------\ns_tocore:\n    set cur_col col_work\n    set state_name \"TO_CORE\"\n    set ret @counter\n    jump do_status always\n    # --- (returned) status applied; travel to the configured core ----\n    set dest_x core_x\n    set dest_y core_y\n    op add move_dead @second move_timeout\n    set ret @counter\n    jump move_to always\n    # --- (returned: arrived at the core)\n    set state st_pickup\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  STATE: PICKUP -- resolve core block ref, unload leftover cargo to the core,\n#                    then load a MAX batch (full cargo)\n# ----------------------------------------------------------------------------\ns_pickup:\n    set cur_col col_work\n    set state_name \"PICKUP\"\n    set ret @counter\n    jump do_status always\n    # --- (returned) status applied; resolve core ref, load a MAX batch ----\n    # --- resolve the core block reference from the bound unit (unit is at core)\n    ucontrol getBlock core_x core_y blk_type the_core blk_floor\n    jump pickup_bad equal blk_type null\n    jump pickup_bad equal blk_type @solid\n    # --- select this trip's item (remembered first, else re-walk) --------\n    set ret @counter\n    jump select_at_core always\n    # --- (returned) selection done ---------------------------------------\n    jump pu_wait notEqual sel_found true # nothing shippable right now\n    # --- (sel_found) unload leftover cargo to the core BEFORE picking new --\n    sensor cap_now the_unit @itemCapacity\n    sensor cargo_item the_unit @firstItem # item type aboard (null when empty)\n    set cnt 0 # pre-reset - sensor with null property does nothing\n    sensor cnt the_unit cargo_item        # current amount of it\n    jump pu_drop_done equal cnt 0 # nothing aboard -> straight to picking\n    set last_cnt cnt\n    set drop_stalls 0\npu_drop_loop:\n    ucontrol itemDrop the_core cap_now\n    wait 0.2\n    sensor cargo_item the_unit @firstItem # item type aboard (null when empty)\n    set cnt 0 # pre-reset - sensor with null property does nothing\n    sensor cnt the_unit cargo_item        # current amount of it\n    op sub diff cnt last_cnt\n    jump pu_drop_prog lessThan diff 0\n    op add drop_stalls drop_stalls 1\npu_drop_prog:\n    set last_cnt cnt\n    jump pu_drop_done equal cnt 0\n    jump pu_drop_giveup greaterThanEq drop_stalls drop_stall_max\n    jump pu_drop_loop always\npu_drop_giveup:\n    print \"leftover cargo could not be dropped to core - continuing\"\n    printflush message2\npu_drop_done:\n    sensor cargo_item the_unit @firstItem # item type aboard (null when empty)\n    set last_cnt 0 # pre-reset - sensor with null property does nothing\n    sensor last_cnt the_unit cargo_item   # current amount of it\n    set pick_stalls 0\npickup_loop:\n    set vb_ret @counter\n    jump validate_bind always\n    sensor cap_now the_unit @itemCapacity\n    jump pickup_plateau greaterThanEq last_cnt cap_now\n    ucontrol itemTake the_core trip_item cap_now\n    wait 0.2\n    sensor cargo_item the_unit @firstItem # item type aboard (null when empty)\n    set cnt 0 # pre-reset - sensor with null property does nothing\n    sensor cnt the_unit cargo_item        # current amount of it\n    op sub diff cnt last_cnt\n    jump pickup_prog greaterThan diff 0\n    op add pick_stalls pick_stalls 1\npickup_prog:\n    set last_cnt cnt\n    jump pickup_plateau greaterThanEq pick_stalls pick_stall_max\n    jump pickup_loop always\npickup_bad:\n    # no core at configured coords -> unrecoverable error state (D20)\n    set state st_coreerr\n    jump pass_end always\npickup_plateau:\n    # cargo full, or source exhausted (no progress for ~1 s)\n    sensor cargo_item the_unit @firstItem # item type aboard (null when empty)\n    set cnt 0 # pre-reset - sensor with null property does nothing\n    sensor cnt the_unit cargo_item        # current amount of it\n    jump pickup_empty equal cnt 0 # nothing picked up -> wait at core\n    set state st_tocont # cargo aboard -> deliver it\n    jump pass_end always\npickup_empty:\n    set state st_waitsrc # nothing to carry yet\n    jump pass_end always\npu_wait:\n    # (from select_at_core) no shippable item right now\n    jump deliver_complete equal any_short false # no missing slots -> complete\n    set state st_waitsrc # some slot short, core empty for it -> retry each pass\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  STATE: WAIT_SOURCE -- parked at the core until it has something to ship\n# ----------------------------------------------------------------------------\ns_waitsrc:\n    set cur_col col_wait\n    set state_name \"WAIT_SOURCE\"\n    set ret @counter\n    jump do_status always\n    # --- (returned) status applied; wait at core for something to ship ----\n    set vb_ret @counter\n    jump validate_bind always\n    # --- (re)resolve the core reference if we do not have one yet\n    jump ws_have_ref notEqual the_core null\n    ucontrol getBlock core_x core_y blk_type the_core blk_floor\n    jump ws_bad equal blk_type null\n    jump ws_bad equal blk_type @solid\nws_have_ref:\n    # --- select this trip's item (remembered first, else re-walk) --------\n    set ret @counter\n    jump select_at_core always\n    # --- (returned) selection done ---------------------------------------\n    jump ws_wait notEqual sel_found true # nothing shippable right now\n    set state st_pickup # shippable item found -> load it\n    jump pass_end always\nws_wait:\n    jump deliver_complete equal any_short false # no missing slots -> complete\n    # nothing shippable yet; stay, select_at_core retries each pass\n    jump pass_end always\nws_bad:\n    # no core ref / not found -> unrecoverable error state (D20)\n    set state st_coreerr\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  STATE: TO_CONTAINER -- travel to the destination storage block\n# ----------------------------------------------------------------------------\ns_tocont:\n    set cur_col col_work\n    set state_name \"TO_CONTAINER\"\n    set ret @counter\n    jump do_status always\n    # --- (returned) status applied; travel to destination storage ----\n    sensor dest_x the_container @x\n    sensor dest_y the_container @y\n    op add move_dead @second move_timeout\n    set ret @counter\n    jump move_to always\n    # --- (returned: arrived at the container)\n    set state st_drop\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  STATE: DROP -- unload everything, then check the target level\n# ----------------------------------------------------------------------------\ns_drop:\n    set cur_col col_work\n    set state_name \"DROP\"\n    set ret @counter\n    jump do_status always\n    # --- (returned) status applied; unload everything ------------------\n    sensor cap_now the_unit @itemCapacity\n    sensor cargo_item the_unit @firstItem # item type aboard (null when empty)\n    set last_cnt 0 # pre-reset - sensor with null property does nothing\n    sensor last_cnt the_unit cargo_item   # current amount of it\n    jump drop_done equal last_cnt 0\n    set drop_stalls 0\ndrop_loop:\n    set vb_ret @counter\n    jump validate_bind always\n    ucontrol itemDrop the_container cap_now\n    wait 0.2\n    sensor cargo_item the_unit @firstItem # item type aboard (null when empty)\n    set cnt 0 # pre-reset - sensor with null property does nothing\n    sensor cnt the_unit cargo_item        # current amount of it\n    op sub diff cnt last_cnt\n    jump drop_prog lessThan diff 0\n    op add drop_stalls drop_stalls 1\ndrop_prog:\n    set last_cnt cnt\n    jump drop_done equal last_cnt 0\n    jump drop_stalled greaterThanEq drop_stalls drop_stall_max\n    jump drop_loop always\ndrop_stalled:\n    # container full/unreachable -- keep cargo, bring the unit home\n    op add err_tmp @second 3\n    set err_until err_tmp\n    print \"DROP STALLED - container full or unreachable? cargo kept in unit\"\n    printflush message2\n    set state st_park\n    jump pass_end always\ndrop_done:\n    op add trips_done trips_done 1\n    set state st_idle # completion is decided by the IDLE walk (multi-item)\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  STATE: PARK_RELEASE -- move to the parking spot and hand back control\n#    saved_ok/saved_unit_ref are kept on purpose: next dispatch re-binds this unit first\n# ----------------------------------------------------------------------------\ns_park:\n    set cur_col col_idle\n    set state_name \"PARK_RELEASE\"\n    set ret @counter\n    jump do_status always\n    # --- (returned) status applied; move to parking spot, release ----\n    jump park_inplace equal park_x null\n    set dest_x park_x\n    set dest_y park_y\n    op add move_dead @second move_timeout\n    set ret @counter\n    jump move_to always\npark_inplace:\n    # release control; unit stays where it is (parking spot or in place)\n    ucontrol idle\n    ucontrol unbind\n    print \"unit parked & released\"\n    printflush message2\n    set the_unit null # keep saved_ok/saved_unit_ref -> reuse next time\n    set state st_idle\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  STATE: CONFIG_ERROR -- container1 not linked. NOT terminal: report, wait,\n#    re-run init; recovery happens through init's sanity check when the link\n#    appears (no reload needed). Optional blocks are never checked here.\n# ----------------------------------------------------------------------------\ns_cfgerr:\n    control color illuminator1 col_error # red while waiting (null-safe)\n    print \"CONFIG ERROR: container1 not linked - link it, no reload needed\"\n    printflush message1\n    wait 3\n    jump init always\n\n# ----------------------------------------------------------------------------\n#  STATE: CORE_NOT_FOUND -- core block missing at configured coords. TERMINAL /\n#    unrecoverable: nothing can fix this at runtime (the coordinates point at\n#    nothing; only a coordinate fix + script reload helps). Stays here forever,\n#    re-asserting the indication every ~3 s; the bound unit is released on entry\n#    so a dead script holds no unit.\n# ----------------------------------------------------------------------------\ns_coreerr:\n    control color illuminator1 col_error # red, persistent (null-safe)\n    print \"CORE NOT FOUND at (\"\n    print core_x\n    print \",\"\n    print core_y\n    print \") - fix coordinates and reload\"\n    printflush message1\n    jump ce_done equal the_unit null\n    ucontrol idle\n    ucontrol unbind\n    set the_unit null\nce_done:\n    wait 3\n    jump main_loop always\n\n# ----------------------------------------------------------------------------\n#  SUBROUTINE: move_to -- travel the bound unit to (dest_x, dest_y)\n#    inputs : dest_x dest_y move_dead (@second deadline set by caller)\n#    returns: on arrival via ret; on stuck -> logs, idles unit, state=s_idle,\n#             jumps pass_end (does NOT return to the caller)\n# ----------------------------------------------------------------------------\nmove_to:\n    ucontrol move dest_x dest_y\nmove_poll:\n    set vb_ret @counter\n    jump validate_bind always\n    ucontrol within dest_x dest_y 6 arrived\n    jump move_done equal arrived true\n    jump move_stuck greaterThan @second move_dead\n    wait 0.2\n    jump move_poll always\nmove_done:\n    op add @counter ret 1\nmove_stuck:\n    # path blocked or destination unreachable for move_timeout seconds\n    sensor ux the_unit @x\n    sensor uy the_unit @y\n    op floor ux ux\n    op floor uy uy\n    print \"STUCK moving to (\"\n    print dest_x\n    print \",\"\n    print dest_y\n    print \") at (\"\n    print ux\n    print \",\"\n    print uy\n    print \") - check path/config\"\n    printflush message2\n    op add err_tmp @second 3\n    set err_until err_tmp\n    ucontrol idle\n    set state st_idle\n    set state_name \"IDLE\"\n    set cur_col col_idle\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  SUBROUTINE: validate_bind -- verify we still own the bound unit (throttled)\n#    failure paths jump to stolen_* handlers and never return to the caller\n# ----------------------------------------------------------------------------\nvalidate_bind:\n    op sub vb_counter vb_counter 1\n    jump vb_ok greaterThan vb_counter 0\n    set vb_counter 10\n    sensor dead_now the_unit @dead\n\tsensor ctrl_by the_unit @controller\n\tjump stolen_dead equal the_unit null\n\tjump stolen_dead equal dead_now true\n\top equal is_ours ctrl_by @this\n\tjump vb_ok equal is_ours true\n\tsensor ctrl_type the_unit @controlled\n\tjump stolen_other equal ctrl_type @ctrlProcessor\n\tjump stolen_human always\nvb_ok:\n\top add @counter vb_ret 1\n\nstolen_dead:\n    print \"unit lost (dead/gone) - releasing claim\"\n    printflush message2\n    set the_unit null\n    set saved_ok false\n    jump stolen_common always\nstolen_human:\n    # player/command took it over -> release our claim (corpus convention)\n    print \"control taken by PLAYER/COMMAND on unit \"\n    print the_unit\n    print \" - releasing claim\"\n    printflush message2\n    ucontrol idle\n    ucontrol unbind\n    set the_unit null\n    set saved_ok false\n    jump stolen_common always\nstolen_other:\n    # another processor controls it -> NO writes (would be retaliation-steal)\n    print \"unit \"\n    print the_unit\n    print \" taken over by ANOTHER PROCESSOR - releasing claim, no commands sent\"\n    printflush message2\n    set the_unit null\n    set saved_ok false\nstolen_common:\n    op add err_tmp @second 3\n    set err_until err_tmp\n    set state st_idle\n    set state_name \"IDLE\"\n    set cur_col col_idle\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\n#  SUBROUTINE: bind_scan -- acquire a courier unit without stealing anyone's\n#    each pass calls ubind repeatedly; stops when no unit comes back at all\n#    or the same unit repeats in this attempt (nothing new will come after)\n#    pass 1: look for our previous unit (ref match) -> reuse it\n#    pass 2: take the first free (uncontrolled, alive) unit of the type\n#    dead or foreign-controlled candidates are skipped WITHOUT sending them\n#    any ucontrol command (binding alone never seizes control)\n#    success => the_unit set, saved_ok true ; failure => the_unit null\n# ----------------------------------------------------------------------------\nbind_scan:\n    jump bs_pass2 equal saved_ok false\n    set prev_cand null\nbs_p1_loop:\n    ubind the_unit_type\n    set cand @unit\n    jump bs_pass2 equal cand null # no unit of this type at all -> stop\n    op equal dup cand prev_cand # same unit twice in this attempt -> nothing new will come\n    jump bs_pass2 equal dup true\n    set prev_cand cand\n    sensor cand_dead cand @dead\n    jump bs_p1_loop equal cand_dead true\n    sensor cand_ctrl cand @controlled\n    jump bs_p1_loop notEqual cand_ctrl 0\n    op equal is_match cand saved_unit_ref\n    jump bs_p1_loop equal is_match false\n    # --- found our previous unit, alive and free -----------------------\n    set the_unit cand\n    set saved_ok true\n    print \"rebound previous unit \"\n    print cand\n    printflush message2\n    jump bs_ok always\nbs_pass2:\n    set prev_cand null\nbs_p2_loop:\n    ubind the_unit_type\n    set cand @unit\n    jump bs_fail equal cand null # no unit of this type at all -> stop\n    op equal dup cand prev_cand # same unit twice in this attempt -> nothing new will come\n    jump bs_fail equal dup true\n    set prev_cand cand\n    sensor cand_dead cand @dead\n    jump bs_p2_loop equal cand_dead true\n    sensor cand_ctrl cand @controlled\n    jump bs_p2_loop notEqual cand_ctrl 0\n    set the_unit cand\n    set saved_unit_ref cand\n    set saved_ok true\n    print \"bound unit \"\n    print cand\n    printflush message2\nbs_ok:\n    op add @counter ret 1\nbs_fail:\n    set the_unit null\n    op add @counter ret 1\n\n# ----------------------------------------------------------------------------\n#  SUBROUTINE: do_status -- apply step readout + status light for the current\n#    state. Called at the TOP of every state block (after cur_col/state_name\n#    are set, before any blocking work) so message1 and the light always show\n#    the state that is actually running now -- not the one that just finished.\n#    step line flushes on state change or every 5 s; error flash overrides colour\n# ----------------------------------------------------------------------------\ndo_status:\n    # --- status light (error flash overrides state colour) --------------------------\n    jump ds_no_err greaterThanEq @second err_until\n    set cur_col col_error\nds_no_err:\n    control color illuminator1 cur_col # optional block; null writes are no-ops\n    # --- step readout (message1): flush on state change or every 5 s -------------\n    op add step_due last_step_t 5\n    jump ds_flush notEqual state last_state # state changed -> flush now\n    jump ds_flush greaterThanEq @second step_due # 5 s elapsed -> refresh\nds_skip:\n    op add @counter ret 1\nds_flush:\n    set last_state state\n    set last_step_t @second\n    print \"step: \"\n    print state_name\n    print \" | trips=\"\n    print trips_done\n    print \" | item=\"\n    print trip_item\n    print \"[\"\n    print trip_slot\n    print \"] of \"\n    print item_count\n    jump ds_noitem equal trip_item null # no active item -> skip have readout\n    set have_now 0 # pre-reset: sensor with null resource would leave stale value\n    sensor have_now the_container trip_item\n    print \" | have=\"\n    print have_now\n    print \"/\"\n    print target_amount\nds_noitem:\n    printflush message1\n    op add @counter ret 1\n\n# ----------------------------------------------------------------------------\n#  SUBROUTINE: get_item -- array-sim GET accessor for the item list (read-only)\n#    in : idx (slot index 0..15)   out: result (= item<idx>)\n#    call convention: set ret @counter ; jump get_item always\n#    Layout: prologue is exactly 6 instructions; base capture makes edits\n#    ABOVE this block safe - never insert/remove lines INSIDE the table.\n#    Positions are relative to getBase only (element k = getBase + 2k); no absolute indexes.\n# ----------------------------------------------------------------------------\nget_item:\n    jump item_oob lessThan idx 0 # bounds low (null idx behaves as 0)\n    jump item_oob greaterThanEq idx 16 # bounds high\n    op add getBase @counter 3 # base capture -> first table line\n    op mul t2 idx 2 # stride: 2 instructions per slot\n    op add target getBase t2 # target address for this slot\n    op add @counter target 0 # computed goto into the table\n    set result item0 # = getBase + 0\n    op add @counter ret 1 # return\n    set result item1 # = getBase + 2\n    op add @counter ret 1 # return\n    set result item2 # = getBase + 4\n    op add @counter ret 1 # return\n    set result item3 # = getBase + 6\n    op add @counter ret 1 # return\n    set result item4 # = getBase + 8\n    op add @counter ret 1 # return\n    set result item5 # = getBase + 10\n    op add @counter ret 1 # return\n    set result item6 # = getBase + 12\n    op add @counter ret 1 # return\n    set result item7 # = getBase + 14\n    op add @counter ret 1 # return\n    set result item8 # = getBase + 16\n    op add @counter ret 1 # return\n    set result item9 # = getBase + 18\n    op add @counter ret 1 # return\n    set result item10 # = getBase + 20\n    op add @counter ret 1 # return\n    set result item11 # = getBase + 22\n    op add @counter ret 1 # return\n    set result item12 # = getBase + 24\n    op add @counter ret 1 # return\n    set result item13 # = getBase + 26\n    op add @counter ret 1 # return\n    set result item14 # = getBase + 28\n    op add @counter ret 1 # return\n    set result item15 # = getBase + 30\n    op add @counter ret 1 # return\nitem_oob:\n    print \"get_item OOB idx=\"\n    print idx\n    printflush message2\n    op add @counter ret 1\n\n# ----------------------------------------------------------------------------\n#  SUBROUTINE: select_at_core -- pick the trip item while standing at the core\n#    in : the_core resolved, unit bound; trip_item/trip_slot may be stale\n#    out: sel_found true/false ; any_short true/false ; trip_item/trip_slot\n#         updated when a shippable slot is found\n#    Logic (spec): remembered item first if it has a full batch in core;\n#    else re-walk from slot 0 - the first missing slot with a full batch in\n#    core wins. Nothing shippable + some short -> caller waits and retries.\n# ----------------------------------------------------------------------------\nselect_at_core:\n    set sac_ret ret # preserve caller's return (inner get_item calls clobber ret)\n    set sel_found false\n    set any_short false\n    sensor cap_now the_unit @itemCapacity # live capacity, shared by all items\n    jump sac_walk equal trip_item null # nothing remembered -> straight to walk\n    sensor src_amt the_core trip_item\n    jump sac_use_mem greaterThanEq src_amt cap_now\nsac_walk:\n    set idx 0\nsac_loop:\n    jump sac_done greaterThanEq idx item_count\n    set ret @counter\n    jump get_item always\n    op equal slot_null result null # resume; defensive (walk is count-bounded)\n    jump sac_next_slot equal slot_null true\n    sensor have_now the_container result\n    jump sac_next_slot greaterThanEq have_now target_amount # satisfied -> skip\n    set any_short true\n    sensor src_amt the_core result\n    jump sac_found greaterThanEq src_amt cap_now # full batch + missing -> take it\nsac_next_slot:\n    op add idx idx 1\n    jump sac_loop always\nsac_use_mem:\n    set sel_found true # remembered item is shippable (trip_slot unchanged)\n    jump sac_done always\nsac_found:\n    set trip_item result\n    set trip_slot idx\n    set sel_found true\nsac_done:\n    op add @counter sac_ret 1\n\n# ----------------------------------------------------------------------------\n#  BLOCK: deliver_complete -- all slots satisfied: log the result; if a unit\n#    is bound, park & release it (st_park), else stay IDLE and keep monitoring\n#    for new demand. Ends at pass_end - does NOT return to the caller.\n# ----------------------------------------------------------------------------\ndeliver_complete:\n    set cur_col col_idle # all satisfied again -> green (clears nofree yellow)\n    print \"DELIVERY COMPLETE - \"\n    print trips_done\n    print \" trip(s) done\"\n    printflush message2\n    jump dc_park notEqual the_unit null\n    set state st_idle # nothing bound; keep monitoring for new demand\n    jump pass_end always\ndc_park:\n    set state st_park # park & release (s_park keeps saved ref for reuse)\n    jump pass_end always\n\n# ----------------------------------------------------------------------------\npass_end:\n    # (status visuals are applied at state entry via do_status; nothing else)\n    end"
    ]
  },

    "lines": [
      "# ============================================================================\n#  factory1_transfer.mlog\n# ----------------------------------------------------------------------------\n#  Factory 1 input picker: walks a configured list of candidate items and\n#  feeds the first acceptable one into all linked unloaders (getlink scan).\n#\n#  logic (unchanged from original)\n#    - each pass: if an item was selected before, re-test it first (sticky);\n#      on failure walk the whole list in slot order\n#    - TestResource passes when dst holds < amountToTest of the candidate\n#      AND src still holds more than minSrcAmount of it (reserve floor)\n#    - selection -> every linked @unloader gets config = item + enabled;\n#      no match -> resource null -> all unloaders disabled\n#\n#  configuration (same trick as CoreToContainer.txt)\n#    - item0..item15: zero-terminated candidate list, first null slot ends\n#      it; length auto-detected at init (no count variable to maintain).\n#      Walk order = slot order.\n#    - amountToTest: shared threshold for every slot\n#    - minSrcAmount: minimum reserve kept in src (0 = drain to empty)\n#    - src_block / dst_block: storage refs locked from linked block names at\n#      boot (vault1 = source, container1 = destination by default)\n# ============================================================================\n\nstart:\n    jump main equal initialized true\n    set initialized true\n\n    # --- CONFIG ------------------------------------------------------\n    # Candidate list, zero-terminated: first null slot ends the list; its\n    # length is auto-detected at init (no count variable). Unused trailing\n    # slots stay null. Walk order = slot order (0 first).",
      "    # Items to load",
      {
        "a": "item"
      },
      [
        "    set amountToTest ",
        {
          "p": "amountToTest"
        },
        " # shared threshold for all slots"
      ],
      [
        "    set minSrcAmount ",
        {

ret 1\n\n\n# ----------------------------------------------------------------------------\n#  SUBROUTINE: get_item -- array-sim GET accessor for the item list (read-only)\n#    in : idx (slot index 0..15)   out: result (= item<idx>)\n#    call convention: set ret @counter ; jump get_item always\n#    Layout: prologue is exactly 6 instructions; base capture makes edits\n#    ABOVE this block safe - never insert/remove lines INSIDE the table.\n#    Positions are relative to getBase only (element k = getBase + 2k); no absolute indexes.\n# ----------------------------------------------------------------------------\nget_item:\n    jump item_oob lessThan idx 0 # bounds low (null idx behaves as 0)\n    jump item_oob greaterThanEq idx 16 # bounds high\n    op add getBase @counter 3 # base capture -> first table line\n    op mul t2 idx 2 # stride: 2 instructions per slot\n    op add target getBase t2 # target address for this slot\n    op add @counter target 0 # computed goto into the table\n    set result item0 # = getBase + 0\n    op add @counter ret 1 # return\n    set result item1 # = getBase + 2\n    op add @counter ret 1 # return\n    set result item2 # = getBase + 4\n    op add @counter ret 1 # return\n    set result item3 # = getBase + 6\n    op add @counter ret 1 # return\n    set result item4 # = getBase + 8\n    op add @counter ret 1 # return\n    set result item5 # = getBase + 10\n    op add @counter ret 1 # return\n    set result item6 # = getBase + 12\n    op add @counter ret 1 # return\n    set result item7 # = getBase + 14\n    op add @counter ret 1 # return\n    set result item8 # = getBase + 16\n    op add @counter ret 1 # return\n    set result item9 # = getBase + 18\n    op add @counter ret 1 # return\n    set result item10 # = getBase + 20\n    op add @counter ret 1 # return\n    set result item11 # = getBase + 22\n    op add @counter ret 1 # return\n    set result item12 # = getBase + 24\n    op add @counter ret 1 # return\n    set result item13 # = ge
