<script>// ScriptConfig engine — page logic for the generated index.html (R3: inlined verbatim,
// after make.py's injected `const TEMPLATES` / `ITEMS` / `UNITS`). No modules, no fetch.
// Pure template logic is exposed on window.SC and testable without a DOM; everything
// that touches the document runs only behind the real-document check below.
(function(){
"use strict";

// ── pure: zero-walk + cell expansion (no MLog knowledge beyond the slot shape) ──

// filled = length of the leading non-empty prefix of an array's rows; a blank row
// terminates the list like explicit null, and filled entries pack from index 0.
function filled(a){ let n=0; while(n<a.length && String(a[n]).trim()!=="") n++; return n; }

// expandLines(tpl, vals) -> {lines, owner}: the generated script as an array of
// lines, plus `owner[i]` = the parameter name that produced line i (null for static
// lines). The preview renders one element per line so a single line can be flashed,
// which is why the ownership is reported alongside the text.
//   string line      → emitted as-is
//   cell list        → cells concatenated, {"p":name} replaced by the scalar's value
//   {"a":name} line  → one "<indent>set <var><k> <value>" per filled k (variable size);
//                      fixed size emits all max lines, blanks as null.
//
// A generated parameter line may end with a description comment: make.py emits it as the line's
// LAST cell, a plain string beginning with "#". Because it is a cell, the boundary between the
// code and the comment is already known while the line is built — no scanning, no regex.
function isCommentCell(c){
  if(typeof c!=="string") return false;
  for(let i=0;i<c.length;i++){
    const ch=c.charAt(i);
    if(ch===" "||ch==="\t") continue;
    return ch==="#";
  }
  return false;
}

// Extra breathing room between a value and its comment, on top of the single space make.py
// already emits — so the tightest gap in a run is this many spaces plus one.
const COMMENT_GAP=2;

// alignComments(lines, commentAt): pad each run of consecutive lines that carry a trailing
// comment, so the comments start in the same column. commentAt[i] is the index in line i where
// its comment begins, or -1 when the line has none — and -1 also ENDS a run, so a blank line, a
// label, a comment-less instruction or an array slot line separates groups without needing a
// rule of its own. One pass over the lines; the only allocation is the padding.
function alignComments(lines, commentAt){
  const out=lines.slice();
  let i=0;
  while(i<out.length){
    if(commentAt[i]<0){ i++; continue; }
    let j=i;
    while(j+1<out.length && commentAt[j+1]>=0) j++;
    let max=commentAt[i];
    for(let k=i+1;k<=j;k++) if(commentAt[k]>max) max=commentAt[k];
    // Every line in the run is padded, including a run of one, so a lone commented line is
    // spaced the same as one in a block rather than depending on its neighbours.
    for(let k=i;k<=j;k++){
      const pad=max-commentAt[k]+COMMENT_GAP;
      out[k]=out[k].slice(0,commentAt[k])+" ".repeat(pad)+out[k].slice(commentAt[k]);
    }
    i=j+1;
  }
  return out;
}

// filledString(a): like filled, but for a string array, where "not set" is the unchecked state
// (null) and an EMPTY STRING is a value the user really typed. Treating "" as blank would make
// an empty string unwritable, which is the ambiguity the nullable-string control exists to
// remove.
function filledString(a){
  let n=0;
  while(n<a.length && a[n]!==null && a[n]!==undefined) n++;
  return n;
}

function expandLines(tpl, vals){
  const lines=[], owner=[], commentAt=[];
  const push=(s,o,at)=>{ lines.push(s); owner.push(o===undefined?null:o); commentAt.push(at===undefined?-1:at); };
  const types=paramTypes(tpl);
  // One place decides how a parameter's value reaches the script: a declared string is
  // quoted and escaped, everything else is written as the bare token it already is.
  const valueOf=(name, raw)=>isStringParam(types, name) ? mlogString(raw) : String(raw);
  for(const line of tpl.lines){
    if(typeof line==="string"){ push(line,null); continue; }
    if(Array.isArray(line)){
      let s="", o=null;
      for(const c of line){
        if(typeof c==="object" && c.p!==undefined){ s += valueOf(c.p, vals[c.p]); o=c.p; }
        else s += c;
      }
      // Only a line that has a hole can carry a description, so a single-cell list is left
      // alone; the comment starts where the final cell begins.
      const last=line[line.length-1];
      const at=(line.length>1 && isCommentCell(last)) ? s.length-last.length : -1;
      push(s,o,at); continue;
    }
    const name=line.a, p=tpl.params.find(q=>q.name===name), a=vals[name], ind=p.indent||"";
    const str=isStringParam(types, name);
    if(p.size==="fixed"){
      for(let k=0;k<p.max;k++){
        const val=a[k];
        // A blank row means "not set", which a string writes as the null literal — the same
        // thing an unchecked nullable-string row produces, so the two cannot disagree. For a
        // string, only the unchecked state counts as blank; "" is a set, empty value.
        const blank = str ? (val===null || val===undefined)
                          : (val===undefined || val===null || String(val).trim()==="");
        const text=blank ? "null" : valueOf(name, val);
        push(ind+"set "+p.var+k+" "+text, name);
      }
    } else {
      const n=str ? filledString(a) : filled(a);
      for(let k=0;k<n;k++) push(ind+"set "+p.var+k+" "+valueOf(name, a[k]), name);
    }
  }
  // Static lines keep their exact bytes: only generated parameter lines take part.
  return {lines:alignComments(lines, commentAt), owner};
}

// expand(tpl, vals) -> generated script text (lines joined with "\n").
function expand(tpl, vals){ return expandLines(tpl, vals).lines.join("\n"); }

// ownedIndex(owner, name, k) -> index of the k-th line produced by parameter `name`,
// or -1 when there is none (e.g. a row past the emitted range). `k` omitted/0 → first.
function ownedIndex(owner, name, k){
  const want=k===undefined?0:k;
  let seen=0;
  for(let i=0;i<owner.length;i++){
    if(owner[i]===name){ if(seen===want) return i; seen++; }
  }
  return -1;
}

// ── pure: enum search (the typeable item/unit fields) ──

// Names are compared without their leading @ and case-insensitively, so typing "pol"
// finds "@poly" without needing the @ that every MLog value carries.
function stripAt(s){ return String(s===undefined||s===null?"":s).replace(/^@/,"").toLowerCase(); }

// matchTier(value, query): 0 = the name starts with the query, 1 = it contains the
// query, -1 = no match. An empty query matches everything at tier 0, so the list keeps
// its original order until something is actually typed.
function matchTier(value, query){
  const q=stripAt(query).trim();
  if(q==="") return 0;
  const n=stripAt(value);
  if(n.startsWith(q)) return 0;
  return n.indexOf(q)>-1?1:-1;
}

// rankedOptions(list, query): display order — matches first (better tier, then original
// order), non-matches after them in their original order. Nothing is ever removed, so a
// query that matches nothing returns the whole list unchanged.
function rankedOptions(list, query){
  const q=String(query===undefined||query===null?"":query).trim();
  if(q==="") return list.slice();
  const scored=list.map((v,i)=>({v,i,t:matchTier(v,q)}));
  return scored.filter(o=>o.t>=0).sort((a,b)=>a.t-b.t||a.i-b.i)
    .concat(scored.filter(o=>o.t<0)).map(o=>o.v);
}

// matchCount(list, query): how many entries match — marks where the matches end.
function matchCount(list, query){
  const q=String(query===undefined||query===null?"":query).trim();
  return q===""?list.length:list.filter(v=>matchTier(v,q)>=0).length;
}

// normalizeValue(list, text): the canonical entry when the text names one (ignoring a
// leading @ and case), otherwise the text exactly as typed. "poly" → "@poly", "pol" stays "pol".
function normalizeValue(list, text){
  const s=String(text===undefined||text===null?"":text).trim();
  const hit=list.find(v=>stripAt(v)===stripAt(s));
  return hit===undefined?s:hit;
}

// isKnown(list, value): whether the value is one of the list's entries — drives the
// warning styling for a value the built-in list does not know.
function isKnown(list, value){
  const s=stripAt(value);
  return s!=="" && list.some(v=>stripAt(v)===s);
}

// optionsWithCurrent(list, value): the list, plus the current value when the list does not
// know it — placed FIRST. A blank or unfamiliar entry parked at the bottom would sit at the
// last index, leaving Down clamped there; leading the list instead means the highlight starts
// at the top and Down steps straight onto the first real entry. A known value changes nothing.
function optionsWithCurrent(list, value){
  return isKnown(list, value) ? list.slice() : [value].concat(list);
}

// attentionLines(owner, names): the indices of the lines produced by those parameters.
// owner[i] is the parameter that produced line i (null for static lines), so this is the
// "which preview lines concern this change" decision, separated from how they are marked
// or scrolled into view. Line order, no duplicates (a line has exactly one owner).
// An unknown or empty name simply contributes nothing.
function attentionLines(owner, names){
  const out=[];
  if(!names || !names.length) return out;
  for(let i=0;i<owner.length;i++){
    const o=owner[i];
    if(o!==null && names.indexOf(o)!==-1) out.push(i);
  }
  return out;
}

// blockScrollTop(blockTop, blockBottom, viewHeight): where to scroll so that a run of lines
// is shown. Centred when the run fits the view ("try to center it"); when it is taller than
// the view there is nothing to centre, so its top goes to the top of the view, leaving GAP
// pixels of margin. Coordinates are in the scroll container's own space, so the caller adds
// the current scrollTop. The result may be negative near the start of the script — the
// browser clamps that to 0, which is the "if possible" part of centring.
const BLOCK_GAP=6;
function blockScrollTop(blockTop, blockBottom, viewHeight){
  const h=blockBottom-blockTop;
  return h<=viewHeight ? blockTop-(viewHeight-h)/2 : blockTop-BLOCK_GAP;
}

// ── pure: recovering settings from pasted script text ──
//
// The inputs we accept are three shapes of the same script — our own generated output, the
// marked-up source .txt, and a game export — and we never validate any of them. A line that
// reads `set <var> <value>` is script enough; everything else in the text is ignored.

// scriptLines(text): split on CRLF, LF or CR, dropping a leading byte-order mark.
// One pass, no regex. A trailing newline yields a final empty line, which is harmless here.
function scriptLines(text){
  const s=String(text===undefined||text===null?"":text);
  const start=(s.charAt(0)==="\uFEFF")?1:0;      // a pasted file may carry a BOM
  const out=[]; let cur="";
  for(let i=start;i<s.length;i++){
    const c=s[i];
    if(c==="\n"){ out.push(cur); cur=""; continue; }
    if(c==="\r"){ out.push(cur); cur=""; if(s.charAt(i+1)==="\n") i++; continue; }
    cur+=c;
  }
  out.push(cur);
  return out;
}

// segments(line): the logical pieces of one MLog line, by single-pass state machine.
// The rules, as the language actually behaves here:
//   - a backslash escapes ONLY inside a string, and only \" \\ and \n are escapes; any
//     other \x stays literal. Outside a string a backslash is an ordinary character.
//   - '"' toggles string state.
//   - '#' outside a string starts a comment: it and the rest of the line are dropped.
//   - spaces and tabs separate only outside a string.
// Quotes are consumed, so a string comes back normalized (delimiters gone, escapes
// resolved). Only three escapes means only three ways a value can contain a character that
// would break a generated line — see PLAN.md for the output side of that.
function segments(line){
  const out=[]; let cur="", inStr=false, started=false, i=0;
  while(i<line.length){
    const c=line[i];
    if(inStr && c==="\\" && i+1<line.length){
      const e=line[i+1];
      if(e==='"'){  cur+='"';  i+=2; started=true; continue; }
      if(e==="\\"){ cur+="\\"; i+=2; started=true; continue; }
      if(e==="n"){  cur+="\n"; i+=2; started=true; continue; }
      cur+=c; i++; started=true; continue;          // unknown escape stays literal
    }
    if(c==='"'){ inStr=!inStr; started=true; i++; continue; }
    if(!inStr && c==="#") break;
    if(!inStr && (c===" " || c==="\t")){
      if(started){ out.push(cur); cur=""; started=false; }
      i++; continue;
    }
    cur+=c; started=true; i++;
  }
  if(started) out.push(cur);
  return out;
}

// mlogString(v): a string parameter's value as it is written into the script — quoted and
// escaped. The exact inverse of segments above, and it must stay that way: the three escapes
// here are the three that reader understands, and a value containing anything else goes in
// verbatim.
//
// Quoting is unconditional, never decided by the content. In MLog a bare token is a variable
// reference, so `set x BOOT` reads the variable BOOT while `set x "BOOT"` is the literal; a
// value that happened to need no escaping would silently change meaning if it were emitted
// bare. This is also why only a declared string parameter goes through here — every other
// type's value is a token that is meant to be bare.
//
// null is NOT a string: a string parameter's unchecked state emits the null literal, which is
// the one value that reaches a script unquoted.
function mlogString(v){
  if(v===null || v===undefined) return "null";
  const s=String(v);
  let out='"';
  for(let i=0;i<s.length;i++){
    const c=s.charAt(i);
    if(c==="\\") out+="\\\\";
    else if(c==='"') out+='\\"';
    else if(c==="\n") out+="\\n";
    else out+=c;
  }
  return out+'"';
}

// paramTypes(tpl): name -> declared type, built once so expandLines does not scan the params
// table for every cell of every line.
function paramTypes(tpl){
  const m={};
  for(const p of tpl.params) if(p.type!==undefined) m[p.name]=p.type;
  return m;
}

// isStringParam(types, name): whether a value for this parameter is written as a quoted string.
function isStringParam(types, name){ return types[name]==="string"; }


// parseSettings(t, text) -> {paramName: value | [values]} for everything the text contains.
// Extraction, not validation: a line qualifies when its first pieces are `set <var> <value>`
// (three or more — extra pieces are part of the value, joined by a space; note that affects
// only unusual hand-written lines, since every real value is a single token or a string).
// The variable a scalar is written as is its own name; an array's is `var` (make.py always
// emits it). First occurrence wins, which is right because the config block sits at the top.
//
// The two array kinds import differently, mirroring how they generate:
//   variable — walk var0, var1 … and STOP at the first missing, empty or null slot. This is
//              the zero-walk rule, and it is why a source .txt with trailing `null` slots
//              yields exactly what a generated script or a game export yields.
//   fixed    — read ALL max slots; a missing or null slot becomes an empty row. Stopping at
//              a null here would silently drop any value stored after it, which the fixed
//              form allows (blanks are legal in the middle). Only apply when something was
//              actually found, so an unrelated text cannot blank the array.
function parseSettings(t, text){
  const segs=scriptLines(text).map(segments);
  const find=v=>segs.find(s=>s.length>=3 && s[0]==="set" && s[1]===v);
  const types=paramTypes(t);
  // A string parameter reads back as content, which is what segments already produced (it
  // resolves quotes and escapes). The one value that is not content is the null literal: for a
  // string that means "not set", so it becomes null rather than the four-letter text "null".
  const asValue=(name, raw)=>{
    if(!isStringParam(types, name)) return raw;
    return raw==="null" ? null : raw;
  };
  const found={};
  for(const p of t.params){
    const v=p.var||p.name;
    if(Array.isArray(p.default)){
      if(p.size==="fixed"){
        const arr=[]; let any=false;
        for(let k=0;k<p.max;k++){
          const h=find(v+k);
          if(h) any=true;
          const raw=h?h.slice(2).join(" "):"";
          // Three cases, and they are genuinely different:
          //   no line at all      -> not set: "" for an ordinary type, null for a string
          //   a null line         -> the same "not set"
          //   an empty string ""  -> a SET value that happens to be empty, kept as ""
          // The last one matters because segments consumes the quotes: `set m3 ""` and a
          // missing m3 both leave an empty piece, and only the line's existence tells them
          // apart.
          let slotVal;
          if(!h || raw==="null") slotVal = isStringParam(types, p.name) ? null : "";
          else slotVal = raw;
          arr.push(slotVal);
        }
        if(any) found[p.name]=arr;
      } else {
        const arr=[];
        for(let k=0;k<p.max;k++){
          const h=find(v+k);
          if(!h) break;
          const val=h.slice(2).join(" ");
          if(val==="" || val==="null") break;       // zero-terminated: the list ends here
          arr.push(asValue(p.name, val));
        }
        if(arr.length) found[p.name]=arr;
      }
    } else {
      const h=find(v);
      if(h) found[p.name]=asValue(p.name, h.slice(2).join(" "));
    }
  }
  return found;
}

if(typeof window!=="undefined") window.SC={filled, expand, expandLines, ownedIndex,
  stripAt, matchTier, rankedOptions, matchCount, normalizeValue, isKnown, optionsWithCurrent,
  attentionLines, blockScrollTop, scriptLines, segments, parseSettings,
  mlogString, paramTypes, isStringParam, filledString, defaults,
  isCommentCell, alignComments,
  wheelDir, stepIndex, stepNumber};

// ── pure: wheel stepping ──
// Decided behavior: one scroll event = one step (no delta normalization — a touchpad
// simply simulates mouse scrolling), and a step at either end holds instead of moving.

// Direction of a wheel delta: -1 up, +1 down, 0 for a no-op (zero) delta.
function wheelDir(deltaY){ return deltaY>0?1:(deltaY<0?-1:0); }

// Clamped selection step: sits at 0 / n-1 at the ends rather than wrapping.
function stepIndex(i, n, d){ const j=i+d; return j<0?0:(j>n-1?n-1:j); }

// Number step: +1/-1 per event. null when the field holds no usable number
// (empty or non-numeric) — the caller then does nothing rather than invent a value.
function stepNumber(value, d){
  const t=String(value).trim();
  if(t==="") return null;
  const v=Number(t);
  return Number.isFinite(v)?String(v+d):null;
}

// ── DOM wiring (browser only) ──
if(typeof document==="undefined" || typeof TEMPLATES==="undefined") return;

const $=id=>document.getElementById(id);
let tpl=null, vals={};

function el(tag, cls){ const e=document.createElement(tag); if(cls) e.className=cls; return e; }

// defaults: scalar → p.default (string, or null for a nullable string that is not set),
// array → copy of default[] (contiguous prefix).
function defaults(t){
  const v={};
  for(const p of t.params){
    if(Array.isArray(p.default)){ v[p.name]=p.default.slice(); continue; }
    // A null default is a string parameter's "not set" and must stay null: String(null ?? "")
    // would turn it into an empty string — a different value — so an unchecked field would
    // load as a checked one holding nothing.
    v[p.name]=(p.default===null || p.default===undefined) ? null : String(p.default);
  }
  return v;
}

// Wheel over a FOCUSED field steps it instead of scrolling the parameters panel.
// Hover needs no test of its own: a wheel event is delivered to the element under the
// pointer, so this listener running at all means the cursor is over the field. Both
// conditions are therefore required — focus here, hover by delivery.
//
// Every qualifying event is swallowed, even when it changes nothing (list boundary,
// text field, unparsable number): nothing behind the field may scroll. Modifier
// gestures (ctrl+wheel zoom, shift/alt) are left alone.
function attachWheelStep(elm, evtName){
  elm.addEventListener("wheel", ev=>{
    if(ev.ctrlKey||ev.altKey||ev.shiftKey) return;
    // contains() also covers an enum combo, whose focus lives on the input inside it.
    if(!elm.contains(document.activeElement)) return;
    const d=wheelDir(ev.deltaY);
    if(d===0) return;
    ev.preventDefault();
    let changed=false;
    if(elm.tagName==="SELECT"){
      const j=stepIndex(elm.selectedIndex, elm.options.length, d);
      if(j!==elm.selectedIndex){ elm.selectedIndex=j; changed=true; }
    } else if(elm.type==="number"){
      const v=stepNumber(elm.value, d);
      if(v!==null && v!==elm.value){ elm.value=v; changed=true; }
    } else if(elm._list){
      // enum combo: browse the full list by wheel; any half-typed query is dropped
      const list=elm._list, i=list.indexOf(elm.value);
      const nv=list[stepIndex(i<0?0:i, list.length, d)];
      if(nv!==elm.value){ elm.value=nv; changed=true; }
      if(openWrap===elm){ elm._typed=false; elm._inp.value=elm.value; comboRefresh(elm); }
    }
    // text fields: swallowed with no step — no logical next value exists
    // setting .value fires no event, so drive the existing listeners explicitly
    if(changed) elm.dispatchEvent(new Event(evtName, {bubbles:true}));
  }, {passive:false});
}

// ── enum field: a typeable input backed by one shared floating list ──
//
// Typing REORDERS the list — matches float to the top, everything else stays below a
// divider — so no option is ever hidden. The value changes only on an explicit pick
// (Enter, click, or arrows then leaving the field), never while typing, so the generated
// script never shows a half-typed item. A value the built-in list does not know is kept
// (not reverted) and flagged in the warning colour.

const popup=el("div","combolist"); popup.hidden=true; document.body.append(popup);
let openWrap=null, order=[], active=-1;

// The options for a field: the built-in list, plus the current value when the list does
// not know it — an unfamiliar value stays visible and flagged rather than being lost, and
// it leads the list so keyboard browsing starts at the top (see optionsWithCurrent).
function comboList(wrap){
  return optionsWithCurrent(wrap._list, wrap._value);
}

function setActive(wrap, i, setText){
  active=i;
  (wrap._opts||[]).forEach((d,j)=>d.classList.toggle("act", j===i));
  if(i>=0 && wrap._opts[i]){
    wrap._opts[i].scrollIntoView({block:"nearest"});
    if(setText) wrap._inp.value=order[i];   // arrows preview the entry they land on
  }
}

function comboRefresh(wrap){
  const list=comboList(wrap);
  const q=wrap._typed?wrap._inp.value:"";
  order=rankedOptions(list, q);
  const matched=matchCount(list, q);
  popup.innerHTML=""; wrap._opts=[];
  order.forEach((v,i)=>{
    if(matched>0 && matched<order.length && i===matched) popup.append(el("div","sep"));
    const d=el("div","opt");
    d.textContent=v; d._value=v;
    if(v===wrap._value) d.classList.add("cur");
    // An empty entry means "no item here" for an array row, not an unknown value — the
    // field itself is not flagged for being blank, so its list entry matches.
    if(v!=="" && !isKnown(wrap._list, v)) d.classList.add("unk");
    popup.append(d); wrap._opts.push(d);
  });
  // Nothing typed → mark where you are and bring it into view; typed → mark the best match.
  setActive(wrap, wrap._typed ? (matched>0?0:-1) : order.indexOf(wrap._value), false);
}

function closeList(){ popup.hidden=true; popup.innerHTML=""; openWrap=null; order=[]; active=-1; }

// Keep the list against its field; flip above it when there is no room below.
function positionList(wrap){
  const r=wrap.getBoundingClientRect();
  const h=Math.min(popup.scrollHeight, 230);
  const below=window.innerHeight-r.bottom-6, above=r.top-6;
  const up=below<h && above>below;
  popup.style.left=r.left+"px";
  popup.style.width=r.width+"px";
  popup.style.top=(up?Math.max(4, r.top-h-2):r.bottom+2)+"px";
}

// Make `v` the field's value: close, display it, flag it when unrecognised, and drive the
// existing listeners (which read .value and re-render the preview) only when it changed.
function commitValue(wrap, v){
  closeList();
  const changed=v!==wrap._value;
  wrap.value=v;
  wrap._typed=false;
  if(changed) wrap.dispatchEvent(new Event("input", {bubbles:true}));
}

function openList(wrap){
  if(openWrap && openWrap!==wrap) closeList();
  openWrap=wrap;
  popup.hidden=false;        // visible first: the refresh scrolls the current entry into view
  comboRefresh(wrap);
  positionList(wrap);
}

function makeCombo(list, value){
  const wrap=el("div","combo");
  const inp=document.createElement("input");
  inp.type="text"; inp.className="comboin"; inp.autocomplete="off"; inp.spellcheck=false;
  inp.value=value;
  const car=el("span","car"); car.textContent="▾";
  wrap.append(inp, car);
  wrap._list=list; wrap._inp=inp; wrap._opts=[]; wrap._typed=false;
  wrap._value=String(value===undefined||value===null?"":value);
  // `.value` on the wrapper is what every existing call site reads and writes.
  Object.defineProperty(wrap, "value", {
    get(){ return wrap._value; },
    set(v){
      wrap._value=String(v===undefined||v===null?"":v);
      inp.value=wrap._value;
      wrap.classList.toggle("warn", wrap._value!=="" && !isKnown(list, wrap._value));
    }
  });
  wrap.value=wrap._value;

  inp.addEventListener("focus", ()=>{ wrap._typed=false; inp.select(); openList(wrap); });
  inp.addEventListener("input", ()=>{ wrap._typed=true; comboRefresh(wrap); });
  inp.addEventListener("blur", ()=>{ commitValue(wrap, normalizeValue(wrap._list, inp.value)); });
  inp.addEventListener("keydown", ev=>{
    if(ev.key==="ArrowDown" || ev.key==="ArrowUp"){
      ev.preventDefault();
      if(popup.hidden){ openList(wrap); return; }
      if(!order.length) return;
      const i=active+(ev.key==="ArrowDown"?1:-1);
      setActive(wrap, Math.max(0, Math.min(order.length-1, i)), true);
    } else if(ev.key==="Enter"){
      ev.preventDefault();
      const pick=active>=0 && order[active]!==undefined;
      commitValue(wrap, pick ? order[active] : normalizeValue(wrap._list, inp.value));
    } else if(ev.key==="Escape"){
      ev.preventDefault();
      wrap._typed=false; inp.value=wrap._value; closeList();
    }
  });
  return wrap;
}

// A click in the list picks; preventDefault keeps focus in the field so the blur path
// (which would commit the typed text first) never fires.
popup.addEventListener("mousedown", ev=>{
  const d=ev.target.closest?ev.target.closest(".opt"):null;
  if(!d || !openWrap) return;
  ev.preventDefault();
  commitValue(openWrap, d._value);
});
// A click anywhere else commits whatever the open field holds, then closes it.
document.addEventListener("mousedown", ev=>{
  if(openWrap && !openWrap.contains(ev.target) && !popup.contains(ev.target))
    commitValue(openWrap, normalizeValue(openWrap._list, openWrap._inp.value));
});
// The panel scrolls under the list: follow the field, or close when it leaves sight.
$("params").addEventListener("scroll", ()=>{
  if(!openWrap) return;
  const r=openWrap.getBoundingClientRect(), p=$("params").getBoundingClientRect();
  if(r.bottom<p.top || r.top>p.bottom) commitValue(openWrap, normalizeValue(openWrap._list, openWrap._inp.value));
  else positionList(openWrap);
}, {passive:true});
window.addEventListener("resize", ()=>{ if(openWrap) positionList(openWrap); });

// widget per type: int → number input; unit/item → typeable combo over the built-in
// list; string → the nullable-string control below; undefined/other → generic text.
function makeWidget(type, value){
  if(type==="string") return makeStringWidget(value);
  let w;
  if(type==="int"){ w=document.createElement("input"); w.type="number"; w.value=value; }
  else if(type==="unit"||type==="item"){ w=makeCombo(type==="unit"?UNITS:ITEMS, value); }
  else { w=document.createElement("input"); w.type="text"; w.value=value; }
  attachWheelStep(w, "input");
  return w;
}

// A string parameter's control: a checkbox that says whether the value is set at all, and a
// text area holding the content. Unchecked writes the null literal into the script and the
// text area is disabled — there is nothing to type into a value that is not there.
//
// The text area is the CONTENT the script will read, not the source token: quotes are absent
// (they are added on output) and escapes are resolved (a real newline is shown as one, not as
// \n). That is the whole point — what is typed is what the script gets, so a backslash is a
// backslash and there is nothing to escape or unescape by hand.
//
// `.value` follows the same convention as the combo wrapper: it is what every call site reads
// and writes. Here it can be null, which is the "not set" state, so it must not be coerced to
// an empty string the way the combo's is.
function makeStringWidget(value){
  const wrap=el("div","strwrap");
  const box=document.createElement("input"); box.type="checkbox"; box.className="strbox";
  const area=document.createElement("textarea");
  area.className="strin"; area.rows=1; area.spellcheck=false; area.autocomplete="off";
  const set=!(value===null || value===undefined);
  box.checked=set;
  area.value=set?String(value):"";
  area.disabled=!set;
  wrap._box=box; wrap._area=area; wrap._value=set?String(value):null;

  // Grow with the content, so a value with newlines is not hidden behind a scrollbar.
  function fit(){ area.style.height="auto"; area.style.height=area.scrollHeight+"px"; }
  function sync(){ area.disabled=!box.checked; fit(); }
  box.addEventListener("change", sync);
  // Not attachWheelStep: a text field swallows the wheel so it cannot fall through to panel
  // scrolling, but this is multi-line and the wheel has to scroll its own content.
  Object.defineProperty(wrap, "value", {
    get(){ return wrap._value; },
    set(v){
      const on=!(v===null || v===undefined);
      wrap._value=on?String(v):null;
      box.checked=on; area.value=on?String(v):""; area.disabled=!on; fit();
    }
  });
  area.addEventListener("input", ()=>{ wrap._value=box.checked?area.value:null; fit(); });
  wrap.append(box, area);
  requestAnimationFrame(fit);
  return wrap;
}

// Last generated text, kept for Copy: the preview is one element per line, so reading
// the text back out of the DOM would lose the line breaks.
let outText="";

// Honour an OS-level "reduce motion" setting: no flash animation, no smooth scrolling.
const reduceMotion=!!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

// Reset returns the preview to the top, animated like the follow-scroll.
function scrollPreviewTop(){ $("out").scrollTo({top:0, behavior:reduceMotion?"auto":"smooth"}); }

// renderOut(follow) re-renders the preview from the current values.
//
// `follow` describes what deserves attention, and there are two kinds because typing and
// importing are different gestures:
//   {name, k?}          an ordinary edit of one field. That field's line flashes (transient)
//                       and is scrolled to only when it is not already visible.
//   {names, mode:"paste"} an import, which can change several parameters at once. Every line
//                       those parameters produced lights up AND STAYS LIT while the paste
//                       awaits Confirm or Decline, and the view is fitted to the whole run
//                       rather than to one line.
//   null                no attention: reset, script switch, first paint.
function renderOut(follow){
  const out=$("out");
  const res=expandLines(tpl, vals);
  outText=res.lines.join("\n");

  const keep=out.scrollTop;            // rebuilding must not disturb the current view
  const frag=document.createDocumentFragment();
  const els=res.lines.map(s=>{ const d=el("div","ln"); d.textContent=s; frag.append(d); return d; });
  out.innerHTML="";
  out.append(frag);
  out.scrollTop=keep;

  if(!follow) return;

  if(follow.mode==="paste"){
    const idxs=attentionLines(res.owner, follow.names);
    if(!idxs.length) return;           // nothing of this script changed
    for(const i of idxs) els[i].classList.add("held");
    // Fit the changed run: centred when it fits the view, otherwise its top to the top.
    // The lines are already in the DOM, so their positions are measurable now.
    const v=out.getBoundingClientRect();
    const first=els[idxs[0]], last=els[idxs[idxs.length-1]];
    const top=first.getBoundingClientRect().top - v.top + out.scrollTop;
    const bottom=last.getBoundingClientRect().bottom - v.top + out.scrollTop;
    out.scrollTo({top:blockScrollTop(top, bottom, v.height), behavior:reduceMotion?"auto":"smooth"});
    return;
  }

  const i=ownedIndex(res.owner, follow.name, follow.k);
  if(i<0) return;                      // that entry emits no line — nothing to show
  const line=els[i];
  line.classList.add("hit");

  // Scroll only when the line is not already fully visible, so ordinary typing does not
  // yank the view around. Centering is impossible near either end of the script; there
  // it scrolls as close as it can.
  const b=line.getBoundingClientRect(), v=out.getBoundingClientRect();
  if(b.top<v.top || b.bottom>v.bottom){
    line.scrollIntoView({block:"center", inline:"nearest", behavior:reduceMotion?"auto":"smooth"});
  }
}

// The type badge. `string` is shown as "nullable string" because that is what the user is
// actually looking at: a checkbox that decides whether there is a string here at all, and the
// unchecked state writes the null literal. The marker stays just `type:string`.
function typeBadge(type, suffix){
  const b=el("span","badge");
  b.textContent=(type==="string"?"nullable string":type)+(suffix||"");
  return b;
}

function scalarField(p){
  const d=el("div","field"), lab=el("div","lab");
  lab.append(document.createTextNode(p.name));
  if(p.type!==undefined) lab.append(typeBadge(p.type));
  const desc=el("p","desc"); desc.textContent=p.description||"";
  const inp=makeWidget(p.type, vals[p.name]);
  for(const ev of ["input","change"]) inp.addEventListener(ev,()=>{ vals[p.name]=inp.value; renderOut({name:p.name}); });
  d.append(lab, desc, inp); return d;
}

function arrayField(p){
  const d=el("div","field"), lab=el("div","lab");
  lab.append(document.createTextNode(p.name));
  if(p.type!==undefined) lab.append(typeBadge(p.type, "[]"));
  const sb=el("span","badge"); sb.textContent=p.size; lab.append(sb);
  const desc=el("p","desc"); desc.textContent=p.description||"";
  const rows=el("div"), foot=el("div","arrfoot");
  const add=document.createElement("button"); add.textContent="+ add";
  const count=el("span","count"), warn=el("div","gapwarn");
  warn.textContent="gap in list — entries after the first blank are ignored (zero-terminated)";

  function refresh(){
    rows.innerHTML="";
    vals[p.name].forEach((v,i)=>{
      const r=el("div","arrrow"), idx=el("span","idx"); idx.textContent=i;
      const inp=makeWidget(p.type, v);
      for(const ev of ["input","change"]) inp.addEventListener(ev,()=>{ vals[p.name][i]=inp.value; renderOut({name:p.name, k:i}); meta(); });
      const x=el("button","x"); x.textContent="×"; x.title="remove slot "+i;
      x.addEventListener("click",()=>{ vals[p.name].splice(i,1); draw({name:p.name, k:i}); });
      r.append(idx, inp, x); rows.append(r);
    });
    add.disabled=vals[p.name].length>=p.max;
    meta();
  }
  function meta(){
    const f=filled(vals[p.name]), a=vals[p.name];
    count.textContent=f+" / "+p.max+(p.size==="fixed"?" set":" emitted");
    warn.style.display=(p.size!=="fixed" && f<a.length && a.slice(f).some(s=>String(s).trim()!==""))?"block":"none";
  }
  function draw(hit){ refresh(); renderOut(hit); }

  add.addEventListener("click",()=>{ const k=vals[p.name].length; vals[p.name].push(""); draw({name:p.name, k}); const last=rows.lastElementChild; if(last) last.querySelector("input,select").focus(); });
  d.append(lab, desc, rows, foot); foot.append(add, count); d.append(warn);
  refresh(); return d;
}

function buildForm(){
  closeList();                       // the old fields are about to be discarded
  const f=$("form"); f.innerHTML="";
  for(const p of tpl.params) f.appendChild(Array.isArray(p.default)?arrayField(p):scalarField(p));
}

// ── import: fill the form from pasted script text ──────────────────────────
//
// The page never reads the clipboard itself. On file:// a browser hands out about one
// clipboard read per document and then leaves later calls pending forever (measured in
// Vivaldi; Firefox prompts on every read). A real Ctrl+V into a field works everywhere with
// no prompt, so that is the mechanism and the button only reveals the field. Everything
// below runs off the paste event.
//
// Flow: [Paste settings] -> field -> Ctrl+V -> values are applied, the lines they produced
// light up and stay lit, the form locks -> a non-blocking bar in this panel asks to Confirm
// or Decline. Confirm keeps the values; Decline restores the snapshot taken before the
// paste. A paste whose values already match is still applied and highlighted — a paste is a
// deliberate act, and it must respond either way. Reset and the script picker rebuild from
// defaults, which discards a pending paste with it.

let pending=null;                      // { before, applied, missing }
const pasteRow=$("pasterow"), pasteBox=$("pastebox"), pendingBar=$("pending"), noteBox=$("note");

function note(text){ noteBox.textContent=text||""; noteBox.classList.toggle("on", !!text); }
function hidePaste(){ pasteRow.classList.remove("on"); pasteBox.value=""; }

// Lock the parameter form only. Reset and the script picker stay usable — they rebuild the
// form from defaults, so a pending paste is simply discarded rather than kept or reverted.
function lockForm(on){
  $("form").classList.toggle("locked", on);
  document.querySelectorAll("#form input, #form select, #form button").forEach(c=>{ c.disabled=on; });
}
function releaseHeld(){ document.querySelectorAll("#out .ln.held").forEach(d=>d.classList.remove("held")); }
function clearPending(){ pending=null; pendingBar.classList.remove("on"); lockForm(false); hidePaste(); }

$("paste").addEventListener("click",()=>{
  clearPending(); note("");
  pasteRow.classList.add("on");
  pasteBox.focus();
});

// The paste EVENT carries the whole text, so nothing is read from the field itself — it is
// a single-line input and would lose everything after the first newline.
pasteBox.addEventListener("paste", ev=>{
  const text=(ev.clipboardData && ev.clipboardData.getData("text/plain")) || "";
  ev.preventDefault();
  if(text) applyPaste(text);
});
// Enter applies what the field holds, for input that arrived without a paste event.
pasteBox.addEventListener("keydown", ev=>{
  if(ev.key==="Enter"){ ev.preventDefault(); applyPaste(pasteBox.value); }
  else if(ev.key==="Escape"){ ev.preventDefault(); hidePaste(); }   // closes the field only
});

function applyPaste(text){
  const found=parseSettings(tpl, text);
  const names=Object.keys(found);
  if(!names.length){ hidePaste(); note("0 settings found in that text — nothing applied"); return; }

  const before=JSON.parse(JSON.stringify(vals));
  // `applied` = the parameters this text supplied, whether or not their value differs from
  // what is shown: a paste is a deliberate act and must respond either way, so an identical
  // paste still applies and still highlights.
  const applied=[], missing=[];
  for(const p of tpl.params){
    if(names.indexOf(p.name)===-1){ missing.push(p.name); continue; }   // untouched, unflashed
    applied.push(p.name);
    const nv=found[p.name];
    vals[p.name]=Array.isArray(nv)?nv.slice():nv;
  }
  hidePaste(); note("");

  pending={before, applied, missing};
  buildForm();                                   // show the incoming values
  lockForm(true);                                // ...locked until answered
  renderOut({names:applied, mode:"paste"});      // light them up, fit the run
  showPending();
}

function showPending(){
  const msg=$("pmsg");
  msg.innerHTML="";
  const b=document.createElement("b");
  b.textContent=pending.applied.length+(pending.applied.length===1?" setting applied":" settings applied");
  msg.append(b);
  if(pending.missing.length){
    const m=el("span","miss");
    m.textContent=" · "+pending.missing.length+" not found ("+pending.missing.join(", ")+") — left unchanged";
    msg.append(m);
  }
  msg.append(document.createTextNode(" — keep them?"));
  pendingBar.classList.add("on");
}

$("pconfirm").addEventListener("click",()=>{
  if(!pending) return;
  const n=pending.applied.length;
  clearPending();
  releaseHeld();                                 // accepted: the highlight lets go
  note(n+(n===1?" setting kept":" settings kept"));
});

$("pdecline").addEventListener("click",()=>{
  if(!pending) return;
  vals=pending.before;
  clearPending();
  buildForm();
  renderOut(null);                               // rebuilt, so no held class survives
  note("paste discarded — values restored");
});

// ── chrome: script selector (generic over TEMPLATES), reset, copy ──
const sel=$("script");
for(const [id,t] of Object.entries(TEMPLATES)){ const o=document.createElement("option"); o.value=id; o.textContent=t.title; sel.append(o); }
sel.style.display=Object.keys(TEMPLATES).length>1?"":"none";
sel.addEventListener("change",()=>load(sel.value));
attachWheelStep(sel, "change");

$("reset").addEventListener("click",()=>{ clearPending(); note(""); vals=defaults(tpl); buildForm(); renderOut(null); scrollPreviewTop(); });

$("copy").addEventListener("click", async e=>{
  const t=outText, b=e.currentTarget;
  try{ await navigator.clipboard.writeText(t); }
  catch(_){ const ta=el("textarea"); ta.value=t; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  b.textContent="Copied ✓"; b.classList.add("copied");
  setTimeout(()=>{ b.textContent="Copy to clipboard"; b.classList.remove("copied"); },1500);
});

// Switching script replaces everything at once (form, text, length), so the preview
// snaps to the top in the same frame — an animated scroll would read as a stray glide.
function load(id){ clearPending(); note(""); tpl=TEMPLATES[id]; vals=defaults(tpl); buildForm(); renderOut(null); $("out").scrollTop=0; }
load(Object.keys(TEMPLATES)[0]);
})();
</script>
</body>
</html>
